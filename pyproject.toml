[project]
name = "homecloud-mcp"
version = "0.2.1"
description = "HomeCloud platform MCP server (Tasks and future services)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "HomeCloud" }]
dependencies = [
    "homecloud-sdk>=0.5.22",
    "mcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[project.scripts]
homecloud-mcp = "homecloud_mcp.server:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["homecloud_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
